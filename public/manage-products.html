<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Manage Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="index.html"><img src="resources/logo/logo.png" class="logo"></a>
            </div>

            <div class="sidebar-content">
                <a class="nav-item" href="admin-dashboard.html">
                    <img src="../">
                    <label>Dashboard</label>
                </a>
                <a class="nav-item" href="manage-users.html">
                    <img src="../">
                    <label>Manage Users</label>
                </a>
                <a class="nav-item" href="manage-orders.html">
                    <img src="../">
                    <label>Manage Orders</label>
                </a>
                <a class="nav-item" href="manage-products.html">
                    <img src="../">
                    <label>Manage Products</label>
                </a>
                <a class="nav-item" href="admin-settings.html">
                    <img src="../">
                    <label>Settings</label>
                </a>
            </div>

            <div class="sidebar-footer">
                <button id="logout-button">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <div class="title-wrapper">
                    <h1>Manage Products</h1>
                    <button id="create-product-btn">Create product</button>
                </div>
                
            </div>

            <div class="content-main">
                <div id="products-list" class="table-wrapper"></div>
                <div class="form-wrapper">
                    <form id="product-form">
                        <h3 class="form-title">Create product</h3>
                        <input type="text" id="product-id" style="display: none;">
                        <div class="form-item">
                            <label>Name</label>
                            <input type="text" id="product-name" placeholder="Enter product name...">
                        </div>

                        <div class="form-item">
                            <label>Description</label>
                            <input type="text" id="product-description" placeholder="Enter product description...">
                        </div>

                        <div class="form-item">
                            <label>Price</label>
                            <input type="text" id="product-price" placeholder="Enter product price...">
                        </div>

                        <div class="form-item">
                            <label>Current Stock</label>
                            <input type="number" id="product-stock_quantity" placeholder="Enter product stock_quantity...">
                        </div>

                        <div class="form-item img-item">
                            <label>Product Image</label>
                            <input type="file" id="product-image_url" accept="image/*">
                            <img src="" id="product-image"/>
                        </div>

                        <button type="submit">Submit</button>
                        <button type="button" id="cancel-product-btn">Cancel</button>
                    </form>
                </div>
            </div>
            
            <div class="content-footer">

            </div>
        </div>
    </div>

    <script type='module' src='js/main.js'></script>
</body>
</html>
