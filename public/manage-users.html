<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Manage Users</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="index.html"><img src="resources/logo/logo.png" class="logo"></a>
            </div>

            <div class="sidebar-content">
                <a class="nav-item" href="admin-dashboard.html">
                    <img src="../">
                    <label>Dashboard</label>
                </a>
                <a class="nav-item" href="manage-users.html">
                    <img src="../">
                    <label>Manage Users</label>
                </a>
                <a class="nav-item" href="manage-orders.html">
                    <img src="../">
                    <label>Manage Orders</label>
                </a>
                <a class="nav-item" href="manage-products.html">
                    <img src="../">
                    <label>Manage Products</label>
                </a>
                <a class="nav-item" href="admin-settings.html">
                    <img src="../">
                    <label>Settings</label>
                </a>
            </div>

            <div class="sidebar-footer">
                <button id="logout-button">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <div class="title-wrapper">
                    <h1>Manage Users</h1>
                    <button id="create-btn">Create user</button>
                </div>
            </div>

            <div class="content-main">
                <div id="users-list" class="table-wrapper"></div>
                <div class="form-wrapper">
                    <form id="user-form">
                        <h3 class="form-title">Create user</h3>
                        <input type="text" id="user-id" style="display: none;">
                        <div class="form-item">
                            <label>Name</label>
                            <input type="text" id="user-name" placeholder="Enter your name...">
                        </div>

                        <div class="form-item">
                            <label>Email</label>
                            <input type="email" id="user-email" placeholder="Enter your email...">
                        </div>

                        <div class="form-item">
                            <label>Password</label>
                            <input type="password" id="user-password" placeholder="Enter your password...">
                        </div>

                        <div class="form-item">
                            <label>Role</label>
                            <select id="user-role">
                                <option value="customer">Customer</option>
                                <option value="admin">admin</option>
                            </select>
                        </div>

                        <button type="submit">Submit</button>
                        <button type="button" id="cancel-btn">Cancel</button>
                    </form>
                </div>
            </div>
            
            <div class="content-footer">

            </div>
        </div>
    </div>

    <script type='module' src='js/main.js'></script>
</body>
</html>
